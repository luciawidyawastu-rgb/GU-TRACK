<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-label="Template GU Track Consultation Snapshot">
  <rect width="794" height="1123" fill="#FFFFFF"/>
  <rect width="794" height="120" fill="#1F4D3A"/>
  <g transform="translate(40 28)">
    <rect width="64" height="64" rx="19" fill="#FAF6EC"/>
    <path d="M32 12C32 12 46 28 46 37a14 14 0 0 1-28 0C18 28 32 12 32 12z" fill="#1F4D3A"/>
    <path d="M22 38h6l3-6 5 13 3-7h4" stroke="#FAF6EC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="122" y="62" font-family="Poppins, Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#FAF6EC">GU Track Consultation Snapshot</text>
  <text x="122" y="88" font-family="Inter, Arial, sans-serif" font-size="13" fill="#BFD8C0">Pantau Keluhanmu, Pahami Perjalanan Kesehatanmu.</text>

  <!-- Identitas pasien -->
  <rect x="40" y="144" width="714" height="96" rx="16" fill="#F4F7F1"/>
  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">
    <text x="60" y="170">Nama pasien</text><text x="300" y="170">No. rekam medis</text><text x="520" y="170">Tanggal ringkasan</text>
    <text x="60" y="214">Umur / jenis kelamin</text><text x="300" y="214">Dokter</text><text x="520" y="214">Periode tracking</text>
  </g>
  <g stroke="#C9DCC6" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="182" x2="270" y2="182"/><line x1="300" y1="182" x2="490" y2="182"/><line x1="520" y1="182" x2="730" y2="182"/>
    <line x1="60" y1="226" x2="270" y2="226"/><line x1="300" y1="226" x2="490" y2="226"/><line x1="520" y1="226" x2="730" y2="226"/>
  </g>

  <!-- Keluhan utama dan ringkasan -->
  <text x="40" y="278" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F4D3A">Keluhan Utama &amp; Ringkasan Tracking</text>
  <rect x="40" y="290" width="714" height="86" rx="14" fill="#FFFFFF" stroke="#E1E7DE" stroke-width="2"/>
  <g stroke="#EEF1EC" stroke-width="5" stroke-linecap="round"><line x1="60" y1="316" x2="720" y2="316"/><line x1="60" y1="340" x2="660" y2="340"/><line x1="60" y1="364" x2="520" y2="364"/></g>

  <!-- Grafik -->
  <text x="40" y="412" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F4D3A">Grafik Perubahan Gejala</text>
  <rect x="40" y="424" width="714" height="190" rx="14" fill="#FFFFFF" stroke="#E1E7DE" stroke-width="2"/>
  <g stroke="#EEF1EC" stroke-width="2"><line x1="64" y1="470" x2="730" y2="470"/><line x1="64" y1="520" x2="730" y2="520"/><line x1="64" y1="570" x2="730" y2="570"/></g>
  <polyline points="70,560 150,520 230,540 310,490 390,500 470,460 550,470 630,440 720,450" fill="none" stroke="#5E8F6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Timeline -->
  <text x="40" y="650" font-family="Poppins, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F4D3A">Timeline Gejala</text>
  <line x1="56" y1="672" x2="56" y2="790" stroke="#C9DCC6" stroke-width="3"/>
  <circle cx="56" cy="676" r="7" fill="#1F4D3A"/><circle cx="56" cy="732" r="7" fill="#8FAE8B"/><circle cx="56" cy="788" r="7" fill="#8FAE8B"/>
  <g stroke="#EEF1EC" stroke-width="5" stroke-linecap="round">
    <line x1="84" y1="676" x2="600" y2="676"/><line x1="84" y1="732" x2="540" y2="732"/><line x1="84" y1="788" x2="480" y2="788"/>
  </g>

  <!-- Riwayat, obat, alergi, pertanyaan -->
  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F4D3A">
    <text x="40" y="834">Riwayat penyakit</text><text x="280" y="834">Obat</text><text x="520" y="834">Alergi</text>
  </g>
  <rect x="40" y="844" width="220" height="56" rx="12" fill="#F4F7F1"/><rect x="280" y="844" width="220" height="56" rx="12" fill="#F4F7F1"/><rect x="520" y="844" width="234" height="56" rx="12" fill="#F4F7F1"/>
  <text x="40" y="932" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F4D3A">Pertanyaan pasien untuk dokter</text>
  <rect x="40" y="942" width="714" height="56" rx="12" fill="#E3EFF5"/>

  <!-- Bagian dokter -->
  <rect x="40" y="1016" width="714" height="68" rx="14" fill="#FFFFFF" stroke="#8FAE8B" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="60" y="1040" font-family="Poppins, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F4D3A">Diisi oleh dokter</text>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">
    <text x="60" y="1064">Pemeriksaan fisik</text><text x="190" y="1064">Assessment</text><text x="300" y="1064">Diagnosis</text><text x="400" y="1064">Penunjang</text><text x="500" y="1064">Rencana terapi</text><text x="620" y="1064">Catatan</text>
  </g>
  <text x="397" y="1108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9CA3AF">Ringkasan ini berdasarkan data yang dicatat pasien dan bukan diagnosis.</text>
</svg>
